<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2b5fad"/>
    </marker>
    <marker id="arrow3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5b6675"/>
    </marker>
    <path id="star" d="M 0,-7.5 L 2.0,-2.4 L 7.1,-2.4 L 3.1,0.9 L 4.4,6.1 L 0,3.0 L -4.4,6.1 L -3.1,0.9 L -7.1,-2.4 L -2.0,-2.4 Z"/>
  </defs>

  <rect x="0" y="0" width="1300" height="660" fill="#ffffff"/>

  <!-- ============ TOP ROW ============ -->
  <!-- Box 1 -->
  <rect x="24" y="36" width="380" height="150" rx="12" fill="#f5f7fa" stroke="#16202e" stroke-width="2"/>
  <circle cx="52" cy="64" r="15" fill="#2b5fad"/>
  <text x="52" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="78" y="70" font-size="16" font-weight="bold" fill="#16202e" letter-spacing="0.5">SELECT TARGET ZONE</text>
  <g font-size="13.5" fill="#16202e">
    <text x="52" y="102">click a point &#8594; its embedding is the center</text>
    <text x="52" y="126">lasso a region &#8594; centroid of the selection</text>
    <text x="52" y="150">10 nearest documents become exemplars</text>
  </g>

  <!-- Box 2 -->
  <rect x="460" y="36" width="380" height="150" rx="12" fill="#f5f7fa" stroke="#16202e" stroke-width="2"/>
  <circle cx="488" cy="64" r="15" fill="#2b5fad"/>
  <text x="488" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="514" y="70" font-size="16" font-weight="bold" fill="#16202e" letter-spacing="0.5">ASSEMBLE PROMPT</text>
  <g font-size="13.5" fill="#16202e">
    <text x="488" y="102">&#8804;8 exemplars · first 500 characters each</text>
    <text x="488" y="126">+ corpus domain · style directive</text>
    <text x="488" y="150">+ the user's intent, in plain words</text>
  </g>

  <!-- Box 3 -->
  <rect x="896" y="36" width="380" height="150" rx="12" fill="#f5f7fa" stroke="#16202e" stroke-width="2"/>
  <circle cx="924" cy="64" r="15" fill="#2b5fad"/>
  <text x="924" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="950" y="70" font-size="16" font-weight="bold" fill="#16202e" letter-spacing="0.5">GENERATE — SONNET 4.6</text>
  <g font-size="13.5" fill="#16202e">
    <text x="924" y="102">10 candidates as structured JSON</text>
    <text x="924" y="126">title · content · rationale</text>
    <text x="924" y="150" fill="#5b6675">salvage parser recovers truncated JSON</text>
  </g>

  <!-- ============ BOTTOM ROW (right to left) ============ -->
  <!-- Box 4 -->
  <rect x="896" y="440" width="380" height="150" rx="12" fill="#f5f7fa" stroke="#16202e" stroke-width="2"/>
  <circle cx="924" cy="468" r="15" fill="#2b5fad"/>
  <text x="924" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4</text>
  <text x="950" y="474" font-size="16" font-weight="bold" fill="#16202e" letter-spacing="0.5">EMBED CANDIDATES</text>
  <g font-size="13.5" fill="#16202e">
    <text x="924" y="506">Voyage AI — the corpus's own model</text>
    <text x="924" y="530">10 vectors · 1,024 dimensions</text>
    <text x="924" y="554" fill="#5b6675">candidates enter the corpus's space</text>
  </g>

  <!-- Box 5 -->
  <rect x="460" y="440" width="380" height="150" rx="12" fill="#f5f7fa" stroke="#2b5fad" stroke-width="2.5"/>
  <circle cx="488" cy="468" r="15" fill="#2b5fad"/>
  <text x="488" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">5</text>
  <text x="514" y="474" font-size="16" font-weight="bold" fill="#2b5fad" letter-spacing="0.5">SCORE — NATIVE SPACE</text>
  <g font-size="13.5" fill="#16202e">
    <text x="488" y="506">cosine(candidate, centroid), all 1,024 dims</text>
    <text x="488" y="530">&#62;0.8 on-target · &#62;0.6 adjacent · else off-target</text>
    <text x="488" y="554" fill="#5b6675">the 2-D map plays no role in the score</text>
  </g>

  <!-- Box 6 -->
  <rect x="24" y="440" width="380" height="150" rx="12" fill="#f5f7fa" stroke="#16202e" stroke-width="2"/>
  <circle cx="52" cy="468" r="15" fill="#2b5fad"/>
  <text x="52" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">6</text>
  <text x="78" y="474" font-size="16" font-weight="bold" fill="#16202e" letter-spacing="0.5">PLACE + RANK</text>
  <g font-size="13.5" fill="#16202e">
    <text x="52" y="506">PCA transform &#8594; 5-NN in the 50-d space</text>
    <text x="52" y="530">inverse-d&#178; weighted map coordinates</text>
    <text x="52" y="554">top 5 accepted <tspan fill="#c99700" font-weight="bold">&#9733;</tspan> · export CSV · corpus unchanged</text>
  </g>

  <!-- ============ FLOW ARROWS ============ -->
  <line x1="404" y1="111" x2="452" y2="111" stroke="#2b5fad" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="840" y1="111" x2="888" y2="111" stroke="#2b5fad" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="1086" y1="186" x2="1086" y2="432" stroke="#2b5fad" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="1104" y="314" font-size="13" fill="#5b6675">10 candidates</text>
  <line x1="888" y1="515" x2="848" y2="515" stroke="#2b5fad" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="452" y1="515" x2="412" y2="515" stroke="#2b5fad" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- Return arrow: 6 back up to 1 -->
  <line x1="214" y1="432" x2="214" y2="194" stroke="#5b6675" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow3g)"/>
  <text x="199" y="322" font-size="13" fill="#5b6675" text-anchor="middle" transform="rotate(-90 199 322)">inspect placements · re-aim</text>

  <!-- ============ CENTER MINI-MAP ============ -->
  <rect x="490" y="220" width="320" height="176" rx="8" fill="#ffffff" stroke="#c6cdd8" stroke-width="1.5"/>
  <!-- corpus dots -->
  <g fill="#5b6675" opacity="0.55">
    <circle cx="524" cy="254" r="3.5"/><circle cx="548" cy="242" r="3.5"/><circle cx="536" cy="272" r="3.5"/>
    <circle cx="562" cy="262" r="3.5"/><circle cx="520" cy="292" r="3.5"/><circle cx="552" cy="300" r="3.5"/>
    <circle cx="586" cy="248" r="3.5"/><circle cx="600" cy="282" r="3.5"/><circle cx="578" cy="308" r="3.5"/>
    <circle cx="540" cy="330" r="3.5"/><circle cx="572" cy="346" r="3.5"/><circle cx="608" cy="330" r="3.5"/>
    <circle cx="626" cy="308" r="3.5"/><circle cx="634" cy="352" r="3.5"/><circle cx="600" cy="366" r="3.5"/>
    <circle cx="656" cy="240" r="3.5"/><circle cx="676" cy="260" r="3.5"/><circle cx="700" cy="246" r="3.5"/>
  </g>
  <!-- target zone -->
  <ellipse cx="722" cy="316" rx="62" ry="44" fill="#d94f4f" fill-opacity="0.07" stroke="#d94f4f" stroke-width="2" stroke-dasharray="7 5"/>
  <g fill="#5b6675" opacity="0.55">
    <circle cx="700" cy="304" r="3.5"/><circle cx="726" cy="292" r="3.5"/><circle cx="744" cy="316" r="3.5"/>
    <circle cx="712" cy="336" r="3.5"/><circle cx="740" cy="342" r="3.5"/>
  </g>
  <!-- candidate stars (top 5, gold) -->
  <g fill="#c99700" stroke="#8a6a00" stroke-width="0.75">
    <use href="#star" transform="translate(716,314)"/>
    <use href="#star" transform="translate(736,326)"/>
    <use href="#star" transform="translate(702,326)"/>
    <use href="#star" transform="translate(730,302)"/>
    <use href="#star" transform="translate(752,320)"/>
  </g>
  <!-- off-target candidates (open gray) -->
  <circle cx="620" cy="252" r="5" fill="none" stroke="#5b6675" stroke-width="2"/>
  <circle cx="662" cy="366" r="5" fill="none" stroke="#5b6675" stroke-width="2"/>
  <!-- zone label -->
  <text x="778" y="248" font-size="13" fill="#d94f4f" font-weight="bold" text-anchor="middle">target zone</text>
  <line x1="768" y1="254" x2="748" y2="282" stroke="#d94f4f" stroke-width="1.5"/>
  <!-- legend -->
  <g font-size="12.5" fill="#5b6675">
    <circle cx="516" cy="380" r="3.5" fill="#5b6675" opacity="0.55"/>
    <text x="526" y="384">corpus</text>
    <use href="#star" transform="translate(586,380) scale(0.8)" fill="#c99700" stroke="#8a6a00" stroke-width="0.75"/>
    <text x="597" y="384">top-5 candidate</text>
    <circle cx="704" cy="380" r="4.5" fill="none" stroke="#5b6675" stroke-width="1.8"/>
    <text x="714" y="384">other candidate</text>
  </g>
</svg>
